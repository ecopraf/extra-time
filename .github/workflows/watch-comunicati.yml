name: Watch Comunicati LND

# Monitoraggio automatico dei Comunicati Ufficiali LND Lazio.
# Rileva i nuovi comunicati rilevanti (calendari/variazioni) e apre una issue
# di notifica. NON applica nulla al database: l'import resta un passo di revisione.

on:
  schedule:
    - cron: "0 7 * * *" # ogni giorno alle 07:00 UTC
  workflow_dispatch: {} # esecuzione manuale dal tab Actions

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rileva nuovi comunicati (dry run)
        id: detect
        run: |
          OUT=$(node scripts/import-sgs/watch-comunicati.mjs --dry 2>&1 || true)
          echo "$OUT"
          # salva l'output per lo step successivo
          {
            echo 'report<<EOF'
            echo "$OUT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          # conta i nuovi
          NEW=$(echo "$OUT" | grep -c '^\[' || true)
          echo "new_count=$NEW" >> "$GITHUB_OUTPUT"

      - name: Apri issue se ci sono nuovi comunicati
        if: steps.detect.outputs.new_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.detect.outputs.report }}`;
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nuovi comunicati LND da importare — ${today}`,
              body: [
                "Il watcher ha rilevato nuovi comunicati LND Lazio rilevanti per i calendari.",
                "",
                "```",
                report,
                "```",
                "",
                "## Come applicarli",
                "",
                "I comunicati compaiono anche nella pagina **Impostazioni → Monitoraggio calendari** (letta in tempo reale), col badge *Da rivedere*.",
                "",
                "**Programma gare (singola giornata/orari).** Il caso più comune. Dal Monitoraggio, premi **Applica** sul comunicato: vedi un'anteprima (quante partite verrebbero aggiornate) e confermi. Aggiorna data/ora/campo delle partite già presenti — non ne crea di nuove.",
                "",
                "**Nuovo calendario / riformulazione (import completo di un campionato).** Non si fa dall'UI: è un batch pesante. In locale:",
                "1. `node scripts/import-sgs/sync-comunicati.mjs` scarica i PDF nuovi;",
                "2. estrai col parser adatto (`extract-all.mjs` per i giovanili, `extract-dilettanti.mjs` per i dilettanti) e genera il seed con il relativo `build-seed*.mjs`;",
                "3. per i dilettanti (solo andata nelle brochure) completa il ritorno con `node scripts/import-sgs/generate-ritorno-dilettanti.mjs`;",
                "4. revisiona il seed e applica con `pnpm db:seed`.",
                "",
                "Gli script sono idempotenti (supportano `--dry`). Dopo l'import, aggiorna `scripts/import-sgs/state.json` per marcare i comunicati come visti.",
              ].join("\n"),
              labels: ["calendari", "lnd"],
            });
