<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXTRA TIME</title>
<meta name="theme-color" content="#011c4e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#00142d;--navy-900:#011c4e;--blue-700:#0041cc;--blue-600:#0051fb;--blue-500:#2f74ff;--sky-400:#6ea4ff;
  --ice-050:#f4f7fc;--ice-100:#eaf0fa;--line:#d3dcec;--ink-900:#0b1424;--ink-500:#65728a;--ok-600:#1f9d55;--red-600:#b8402f;
  --bg:var(--ice-050);--surface:#fff;--surface-2:var(--ice-100);--text:var(--ink-900);--text-dim:var(--ink-500);--border:var(--line);
  --shadow:0 1px 2px rgba(0,20,50,.06),0 6px 20px -8px rgba(0,20,50,.2);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#050d1d;--surface:#0b1830;--surface-2:#10213f;--text:#eaf0fb;--text-dim:#93a3c0;--border:#1c3157;}}
:root[data-theme="dark"]{--bg:#050d1d;--surface:#0b1830;--surface-2:#10213f;--text:#eaf0fb;--text-dim:#93a3c0;--border:#1c3157;}
*{box-sizing:border-box;}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100%;}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;margin:0;}
.container{max-width:1180px;margin:0 auto;padding:0 16px;}
.hidden{display:none!important;}
button{font-family:inherit;cursor:pointer;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:11px;border:1px solid var(--border);font-weight:700;font-size:14px;background:var(--surface-2);color:var(--text);transition:all .15s ease;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:linear-gradient(135deg,var(--blue-600),var(--blue-500));color:#fff;border-color:transparent;box-shadow:0 6px 18px -6px rgba(0,81,251,.55);}
.btn-primary:hover{box-shadow:0 8px 22px -6px rgba(0,81,251,.7);}
.btn-danger{border-color:var(--red-600);color:var(--red-600);background:transparent;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 10px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);width:100%;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue-500);}
label{font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
.field{margin-bottom:12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);transition:box-shadow .2s ease,transform .2s ease;}

/* Hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--navy-950) 0%,var(--navy-900) 55%,var(--blue-700) 140%);border-radius:22px;padding:34px 30px;margin-bottom:22px;color:#fff;box-shadow:0 16px 40px -18px rgba(0,20,50,.6);}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;background:radial-gradient(circle,rgba(110,164,255,.35),transparent 70%);}
.hero h1{font-size:clamp(26px,4.5vw,38px);color:#fff;position:relative;}
.hero p{color:#c3d3f5;margin-top:6px;max-width:60ch;position:relative;font-size:14px;}
.hero .tag-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative;}
.hero .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;}

/* Floating support button */
.fab-support{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--blue-600),var(--blue-500));color:#fff;border:none;padding:13px 20px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 10px 26px -8px rgba(0,81,251,.6);}
.fab-support:hover{transform:translateY(-2px);}
@media (max-width:600px){.fab-support span.txt{display:none;}.fab-support{padding:14px;}}

/* Topbar */
.appbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 2px 16px -8px rgba(0,20,50,.15);}
.appbar-inner{display:flex;align-items:center;gap:16px;padding:10px 16px;max-width:1180px;margin:0 auto;top:env(safe-area-inset-top,0px);position:relative;}
.brandlogo{display:flex;align-items:center;flex:0 0 auto;background:#ffffff;border:1px solid var(--border);border-radius:12px;padding:6px 12px;box-shadow:0 2px 8px -3px rgba(0,20,50,.15);}
.brandlogo img{height:42px;width:auto;display:block;}
@media (max-width:480px){.brandlogo{padding:5px 9px;}.brandlogo img{height:32px;}}
nav.mainnav{display:flex;gap:6px;flex:1;justify-content:center;position:relative;flex-wrap:wrap;}
.navbtn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:700;letter-spacing:.2px;transition:all .18s ease;}
.navbtn:hover{border-color:var(--blue-500);color:var(--blue-600);}
.navbtn.active{background:linear-gradient(135deg,var(--navy-900),var(--blue-700));border-color:transparent;color:#fff;box-shadow:0 4px 14px -4px rgba(0,65,204,.5);}
.dropdown{position:absolute;top:calc(100% + 8px);background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px -8px rgba(0,0,0,.35);padding:14px;min-width:280px;z-index:60;}
.appbar-actions{display:flex;gap:8px;flex:0 0 auto;align-items:center;}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s ease;}
.iconbtn:hover{background:var(--blue-600);color:#fff;border-color:transparent;transform:translateY(-1px);}
.helpbar-link{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--blue-600);background:rgba(0,81,251,.08);border:1px solid rgba(0,81,251,.2);padding:8px 12px;border-radius:10px;white-space:nowrap;}
.helpbar-link:hover{background:rgba(0,81,251,.15);}
@media (max-width:760px){nav.mainnav{order:3;width:100%;justify-content:flex-start;overflow-x:auto;}.appbar-inner{flex-wrap:wrap;}.helpbar-link{display:none;}}

main{padding:24px 0 80px;}
.pagehead{margin-bottom:18px;}
.pagehead p{color:var(--text-dim);font-size:13.5px;margin-top:4px;}

/* Risultati */
.selrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.selrow select{max-width:220px;}
.matchgrid{display:grid;grid-template-columns:2fr 1fr;gap:18px;}
@media (max-width:760px){.matchgrid{grid-template-columns:1fr;}}
.matchrow{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);font-size:14px;}
.matchrow:last-child{border-bottom:none;}
.matchrow .score{font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:17px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--border);}
th:first-child,td:first-child{text-align:left;}
tr:first-child td{font-weight:700;}

/* Cards grid (news/live/scout) */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:820px){.grid3{grid-template-columns:1fr 1fr;}}
@media (max-width:560px){.grid3{grid-template-columns:1fr;}}
.newscard{padding:18px;display:flex;flex-direction:column;gap:7px;border-top:3px solid var(--blue-600);}
.newscard:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(0,20,50,.3);}
.newscard .date{font-size:11px;font-weight:700;color:var(--blue-600);text-transform:uppercase;letter-spacing:.4px;}
.newscard h3{font-size:19px;}
.newscard p{font-size:13.5px;color:var(--text-dim);margin:0;flex:1;}
.livecard{padding:0;overflow:hidden;}
.livecard:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(0,20,50,.3);}
.livecard .thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy-900),var(--blue-700));display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;position:relative;}
.livecard .thumb::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(110,164,255,.35),transparent 60%);}
.livecard .info{padding:13px 14px;}
.scoutbox{padding:36px 28px;text-align:center;max-width:640px;margin:0 auto;}
.scoutbox .icon{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,var(--blue-600),var(--blue-500));display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;margin:0 auto 16px;box-shadow:0 10px 24px -8px rgba(0,81,251,.5);}

/* Modal */
.modalbg{position:fixed;inset:0;background:rgba(0,10,25,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--surface);border-radius:16px;padding:22px;width:100%;max-width:480px;max-height:88vh;overflow:auto;}

/* Admin */
.admin-layout{display:grid;grid-template-columns:200px 1fr;gap:18px;}
@media (max-width:760px){.admin-layout{grid-template-columns:1fr;}}
.adminnav{display:flex;flex-direction:column;gap:4px;}
.adminnav button{text-align:left;padding:9px 12px;border-radius:9px;border:none;background:transparent;color:var(--text);font-size:13.5px;font-weight:600;}
.adminnav button.active{background:var(--surface-2);}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-dim);}
.tablewrap{overflow-x:auto;}
</style>
</head>
<body>
<div class="appbar"><div class="appbar-inner">
  <div class="brandlogo"><img id="logoImg" alt="EXTRA TIME"></div>
  <nav class="mainnav" id="mainnav"></nav>
  <div class="appbar-actions">
    <button class="helpbar-link" id="btnHelpTop">🛟 Assistenza</button>
    <button class="iconbtn" id="btnSettings" title="Impostazioni">⚙️</button>
    <button class="iconbtn" id="btnProfile" title="Profilo">👤</button>
  </div>
</div></div>
<main><div class="container" id="app"></div></main>
<button class="fab-support" id="fabSupport">🛟 <span class="txt">Assistenza</span></button>
<div id="modalRoot"></div>

function demoGirone(teams){
  const standings = teams.map((t,i)=>({team:t,pg:5,v:5-i%4,n:i%2,p:i%3,gf:12-i,gs:4+i,pts:(5-i%4)*3+(i%2)}));
  standings.sort((a,b)=>b.pts-a.pts);
  const matches=[]; for(let i=0;i<teams.length-1;i+=2){ matches.push({home:teams[i],away:teams[i+1],hs:Math.floor(Math.random()*4),as:Math.floor(Math.random()*4),date:'21/09'}); }
  return { standings, matches };
}

/* ---------- RESULTS PAGE ---------- */
let selRegion=null, selComp=null, selGir=null;
function renderResults(){
  const regions=Object.keys(DB.regions);
  if(!selRegion) selRegion=regions[0];
  const comps=Object.keys(DB.regions[selRegion]||{});
  if(!selComp||!comps.includes(selComp)) selComp=comps[0];
  const gironi=Object.keys((DB.regions[selRegion]||{})[selComp]||{});
  if(!selGir||!gironi.includes(selGir)) selGir=gironi[0];
  const data=(((DB.regions[selRegion]||{})[selComp]||{})[selGir])||{standings:[],matches:[]};
  return `
  <div class="hero"><h1>⚽ Risultati Match</h1><p>Tutto il calcio dilettantistico e giovanile italiano: regioni, campionati, gironi, risultati e classifiche sempre aggiornati.</p>
    <div class="tag-row"><span class="chip">${regions.length} Regioni</span><span class="chip">${comps.length} Campionati</span><span class="chip">Aggiornato in tempo reale</span></div></div>
  <div class="selrow">
    <select id="selRegion">${regions.map(r=>`<option ${r===selRegion?'selected':''}>${r}</option>`).join('')}</select>
    <select id="selComp">${comps.map(c=>`<option ${c===selComp?'selected':''}>${c}</option>`).join('')}</select>
    <select id="selGir">${gironi.map(g=>`<option ${g===selGir?'selected':''}>${g}</option>`).join('')}</select>
  </div>
  <div class="matchgrid">
    <div class="card">${data.matches.map(m=>`<div class="matchrow"><span>${m.home}</span><span class="score">${m.hs} - ${m.as}</span><span>${m.away}</span></div>`).join('')||'<div style="padding:16px;color:var(--text-dim);">Nessuna partita disponibile.</div>'}</div>
    <div class="card" style="padding:14px;">
      <table><tr><td>Squadra</td><th>Pt</th><th>PG</th><th>V</th><th>N</th><th>P</th><th>GF</th><th>GS</th></tr>
      ${data.standings.map((s,i)=>`<tr><td>${i+1}. ${s.team}</td><td>${s.pts}</td><td>${s.pg}</td><td>${s.v}</td><td>${s.n}</td><td>${s.p}</td><td>${s.gf}</td><td>${s.gs}</td></tr>`).join('')}
      </table>
    </div>
  </div>`;
}
function bindResults(){
  $('#selRegion')?.addEventListener('change',e=>{selRegion=e.target.value;selComp=null;selGir=null;render();});
  $('#selComp')?.addEventListener('change',e=>{selComp=e.target.value;selGir=null;render();});
  $('#selGir')?.addEventListener('change',e=>{selGir=e.target.value;render();});
}

/* ---------- SCOUT PLATFORM ---------- */
function renderScout(){
  return `<div class="hero"><h1>🔎 EXTRA TIME - SCOUT PLATFORM</h1><p>La piattaforma di segnalazione talenti (ex TuttoCampo Lazio Scout), rinnovata sotto il marchio EXTRA TIME.</p></div>
  <div class="card scoutbox"><div class="icon">🔎</div>
    <h3 style="font-size:22px;">Modulo Scout Platform</h3>
    <p style="color:var(--text-dim);font-size:14px;">Qui verrà integrata la piattaforma scout completa (login clienti, piani abbonamento, richieste di osservazione, designazioni scout) che mi hai fornito nel file index. È un modulo a sé con il proprio backend: dimmi se vuoi che lo colleghi qui come pagina dedicata/iframe oppure che lo ricostruisca dentro questo stesso sito.</p>
    <button class="btn btn-primary" id="scoutCta">Accedi alla Scout Platform</button>
  </div>`;
}

/* ---------- NEWS ---------- */
function renderNews(){
  return `<div class="hero"><h1>📰 News</h1><p>Tutte le notizie pubblicate dalla redazione di EXTRA TIME.</p></div>
  <div class="grid3">${DB.news.map(n=>`<div class="card newscard"><span class="date">${n.date}</span><h3>${n.title}</h3><p>${n.excerpt}</p></div>`).join('')||'<p>Nessuna notizia pubblicata.</p>'}</div>`;
}

/* ---------- LIVE ---------- */
function renderLive(){
  return `<div class="hero"><h1>🔴 Live</h1><p>Guarda le dirette delle partite in stile piattaforma video.</p></div>
  <div class="grid3">${DB.live.map(l=>`<div class="card livecard"><div class="thumb">▶</div><div class="info"><h3 style="font-size:16px;">${l.title}</h3><span class="tag">${l.status}</span></div></div>`).join('')}</div>`;
}

/* ---------- ADMIN ---------- */
let adminTab='news';
function renderAdmin(){
  const tabs=[['news','News'],['support','Assistenza'],['staff','Staff'],['championships','Campionati & Risultati'],['clubs','Società'],['players','Calciatori'],['users','Profili']];
  return `<div class="pagehead"><h1>Pannello Amministratore</h1><p>Gestione completa del sito EXTRA TIME.</p></div>
  <div class="admin-layout">
    <div class="adminnav card" style="padding:10px;">${tabs.map(t=>`<button data-tab="${t[0]}" class="${adminTab===t[0]?'active':''}">${t[1]}</button>`).join('')}</div>
    <div class="card" style="padding:18px;" id="adminBody">${renderAdminTab()}</div>
  </div>`;
}
function renderAdminTab(){
  if(adminTab==='news') return `
    <h3>Crea notizia</h3>
    <div class="field"><label>Titolo</label><input id="an_title"></div>
    <div class="field"><label>Estratto</label><textarea id="an_excerpt" rows="2"></textarea></div>
    <button class="btn btn-primary btn-sm" id="an_add">Pubblica</button>
    <hr style="border-color:var(--border);margin:18px 0;">
    <div class="tablewrap"><table>${DB.news.map(n=>`<tr><td>${n.title}</td><td>${n.date}</td><td><button class="btn btn-danger btn-sm" data-delnews="${n.id}">Elimina</button></td></tr>`).join('')}</table></div>`;
  if(adminTab==='support') return `
    <h3>Assistenza</h3><p style="color:var(--text-dim);font-size:13.5px;">Invia una segnalazione al team EXTRA TIME.</p>
    <div class="field"><label>Oggetto</label><input id="sup_subj" placeholder="Descrivi il problema"></div>
    <div class="field"><label>Messaggio</label><textarea id="sup_body" rows="4"></textarea></div>
    <button class="btn btn-primary btn-sm" id="sup_send">Apri email a extratime.italia@gmail.com</button>`;
  if(adminTab==='staff') return `
    <h3>Credenziali Staff</h3>
    <div class="field"><label>Nome</label><input id="st_name"></div>
    <div class="field"><label>Email</label><input id="st_email"></div>
    <div class="field"><label>Ruolo</label><select id="st_role"><option>Amministratore</option><option>Redattore News</option><option>Moderatore Risultati</option></select></div>
    <button class="btn btn-primary btn-sm" id="st_add">Crea credenziale</button>
    <hr style="border-color:var(--border);margin:18px 0;">
    <div class="tablewrap"><table>${DB.staff.map(s=>`<tr><td>${s.name}</td><td>${s.email}</td><td>${s.role}</td></tr>`).join('')}</table></div>`;
  if(adminTab==='championships') return `
    <h3>Nuovo campionato</h3>
    <div class="field"><label>Regione (esistente o nuova)</label><input id="ch_region" placeholder="Es. Lazio" list="dl_regions"><datalist id="dl_regions">${Object.keys(DB.regions).map(r=>`<option>${r}</option>`).join('')}</datalist></div>
    <div class="field"><label>Campionato</label><input id="ch_comp" placeholder="Es. Eccellenza"></div>
    <div class="field"><label>Girone</label><input id="ch_gir" placeholder="Es. Girone A"></div>
    <div class="field"><label>Squadre (separate da virgola)</label><input id="ch_teams" placeholder="Squadra1, Squadra2, ..."></div>
    <button class="btn btn-primary btn-sm" id="ch_add">Crea girone</button>
    <hr style="border-color:var(--border);margin:18px 0;">
    <h3>Inserisci risultato</h3>
    <div class="field"><label>Regione</label><select id="rs_region">${Object.keys(DB.regions).map(r=>`<option>${r}</option>`).join('')}</select></div>
    <div class="field"><label>Campionato</label><select id="rs_comp"></select></div>
    <div class="field"><label>Girone</label><select id="rs_gir"></select></div>
    <div class="field" style="display:flex;gap:8px;"><input id="rs_home" placeholder="Squadra casa"><input id="rs_hs" type="number" style="max-width:70px" placeholder="0"><input id="rs_as" type="number" style="max-width:70px" placeholder="0"><input id="rs_away" placeholder="Squadra ospite"></div>
    <button class="btn btn-primary btn-sm" id="rs_add">Aggiungi risultato</button>`;
  if(adminTab==='clubs') return `
    <h3>Nuova società</h3>
    <div class="field"><label>Nome società</label><input id="cl_name"></div>
    <button class="btn btn-primary btn-sm" id="cl_add">Aggiungi società</button>
    <hr style="border-color:var(--border);margin:18px 0;">
    <div class="tablewrap"><table>${DB.clubs.map(c=>`<tr><td>${c.name}</td><td><button class="btn btn-danger btn-sm" data-delclub="${c.id}">Elimina</button></td></tr>`).join('')}</table></div>`;
  if(adminTab==='players') return `
    <h3>Nuovo calciatore</h3>
    <div class="field"><label>Nome</label><input id="pl_name"></div>
    <div class="field"><label>Ruolo</label><input id="pl_role"></div>
    <div class="field"><label>Società</label><select id="pl_club">${DB.clubs.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
    <button class="btn btn-primary btn-sm" id="pl_add">Aggiungi calciatore</button>
    <hr style="border-color:var(--border);margin:18px 0;">
    <div class="tablewrap"><table>${DB.players.map(p=>`<tr><td>${p.name}</td><td>${p.role}</td><td>${(DB.clubs.find(c=>c.id===p.clubId)||{}).name||'-'}</td></tr>`).join('')}</table></div>`;
  if(adminTab==='users') return `<p style="color:var(--text-dim);">Gestione profili utente collegata al sistema di autenticazione (da agganciare a un backend, es. Supabase, come nel modulo Scout Platform).</p>`;
  return '';
}
function bindAdmin(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{adminTab=b.dataset.tab;render();}));
  $('#an_add')?.addEventListener('click',()=>{
    const t=$('#an_title').value.trim(); if(!t)return;
    DB.news.unshift({id:Date.now(),title:t,date:new Date().toISOString().slice(0,10),excerpt:$('#an_excerpt').value.trim()});
    saveDB();render();
  });
  document.querySelectorAll('[data-delnews]').forEach(b=>b.addEventListener('click',()=>{DB.news=DB.news.filter(n=>n.id!=b.dataset.delnews);saveDB();render();}));
  $('#sup_send')?.addEventListener('click',()=>{
    const subj=encodeURIComponent($('#sup_subj').value||'Segnalazione EXTRA TIME');
    const body=encodeURIComponent($('#sup_body').value||'');
    window.location.href=`mailto:extratime.italia@gmail.com?subject=${subj}&body=${body}`;
  });
  $('#st_add')?.addEventListener('click',()=>{
    const n=$('#st_name').value.trim(),e=$('#st_email').value.trim(); if(!n||!e)return;
    DB.staff.push({id:Date.now(),name:n,email:e,role:$('#st_role').value}); saveDB();render();
  });
  $('#cl_add')?.addEventListener('click',()=>{
    const n=$('#cl_name').value.trim(); if(!n)return;
    DB.clubs.push({id:Date.now(),name:n}); saveDB();render();
  });
  document.querySelectorAll('[data-delclub]').forEach(b=>b.addEventListener('click',()=>{DB.clubs=DB.clubs.filter(c=>c.id!=b.dataset.delclub);saveDB();render();}));
  $('#pl_add')?.addEventListener('click',()=>{
    const n=$('#pl_name').value.trim(); if(!n)return;
    DB.players.push({id:Date.now(),name:n,role:$('#pl_role').value,clubId:Number($('#pl_club').value)}); saveDB();render();
  });
  if($('#ch_add')){
    $('#ch_add').addEventListener('click',()=>{
      const reg=$('#ch_region').value.trim(),comp=$('#ch_comp').value.trim(),gir=$('#ch_gir').value.trim();
      const teams=$('#ch_teams').value.split(',').map(t=>t.trim()).filter(Boolean);
      if(!reg||!comp||!gir||teams.length<2)return alert('Compila tutti i campi (almeno 2 squadre).');
      DB.regions[reg]=DB.regions[reg]||{}; DB.regions[reg][comp]=DB.regions[reg][comp]||{};
      DB.regions[reg][comp][gir]=demoGirone(teams); saveDB(); render();
    });
    const fillComp=()=>{ const r=$('#rs_region').value; $('#rs_comp').innerHTML=Object.keys(DB.regions[r]||{}).map(c=>`<option>${c}</option>`).join(''); fillGir(); };
    const fillGir=()=>{ const r=$('#rs_region').value,c=$('#rs_comp').value; $('#rs_gir').innerHTML=Object.keys((DB.regions[r]||{})[c]||{}).map(g=>`<option>${g}</option>`).join(''); };
    $('#rs_region').addEventListener('change',fillComp); $('#rs_comp').addEventListener('change',fillGir);
    fillComp();
    $('#rs_add').addEventListener('click',()=>{
      const r=$('#rs_region').value,c=$('#rs_comp').value,g=$('#rs_gir').value;
      const home=$('#rs_home').value.trim(),away=$('#rs_away').value.trim();
      if(!home||!away)return alert('Inserisci entrambe le squadre.');
      const girone=DB.regions[r][c][g];
      girone.matches.unshift({home,away,hs:Number($('#rs_hs').value||0),as:Number($('#rs_as').value||0),date:new Date().toLocaleDateString('it-IT')});
      saveDB(); render();
    });
  }
}

/* ---------- MODAL / LOGIN ---------- */
function openModal(html){ $('#modalRoot').innerHTML = `<div class="modalbg" id="mbg"><div class="modal">${html}</div></div>`; $('#mbg').addEventListener('click',e=>{if(e.target.id==='mbg')closeModal();}); }
function closeModal(){ $('#modalRoot').innerHTML=''; }
function showProfileMenu(){
  openModal(`<h3>Profilo</h3><p style="color:var(--text-dim);font-size:13.5px;">Stato: <b>${session.isAdmin?'Amministratore':'Utente'}</b></p>
    <div class="field"><label>Accedi come</label><select id="pf_role"><option value="user">Utente</option><option value="admin">Amministratore</option></select></div>
    <button class="btn btn-primary btn-sm" id="pf_login">Accedi</button>
    <button class="btn btn-sm" id="pf_close" style="margin-left:8px;">Chiudi</button>`);
  $('#pf_close').addEventListener('click',closeModal);
  $('#pf_login').addEventListener('click',()=>{ session.isAdmin=$('#pf_role').value==='admin'; closeModal(); page= session.isAdmin?'admin':'results'; render(); });
}
function showSettingsMenu(){
  openModal(`<h3>Impostazioni</h3>
    <div class="field"><label>Tema</label><select id="st_theme"><option value="">Automatico</option><option value="light">Chiaro</option><option value="dark">Scuro</option></select></div>
    <button class="btn btn-primary btn-sm" id="st_save">Salva</button>`);
  $('#st_theme').value = localStorage.getItem('extraTimeTheme')||'';
  $('#st_save').addEventListener('click',()=>{ const v=$('#st_theme').value; localStorage.setItem('extraTimeTheme',v); document.documentElement.setAttribute('data-theme',v); closeModal(); });
}
$('#btnProfile').addEventListener('click',showProfileMenu);
$('#btnSettings').addEventListener('click',showSettingsMenu);
$('#btnHelpTop').addEventListener('click',showSupportModal);
$('#fabSupport').addEventListener('click',showSupportModal);

/* ---------- RENDER ---------- */
function render(){
  renderNav();
  if(session.isAdmin && !NAVS.find(n=>n.id==='admin')) NAVS.push({id:'admin',label:'⚙ Admin'});
  renderNav();
  let html='';
  if(page==='results') html=renderResults();
  else if(page==='scout') html=renderScout();
  else if(page==='news') html=renderNews();
  else if(page==='live') html=renderLive();
  else if(page==='admin') html=session.isAdmin?renderAdmin():'<p>Accesso riservato agli amministratori.</p>';
  $('#app').innerHTML=html;
  if(page==='results') bindResults();
  if(page==='admin') bindAdmin();
  if(page==='scout') $('#scoutCta')?.addEventListener('click',()=>alert('Qui si aprirà il login della Scout Platform (modulo da collegare).'));
}
document.documentElement.setAttribute('data-theme', localStorage.getItem('extraTimeTheme')||'');
render();
</script>
</body>
</html>
